<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>储能变电站 · WebGPU / three.js</title>
<style>
  :root{
    --panel: rgba(14,18,24,.72);
    --line: rgba(255,255,255,.12);
    --txt: #e7edf5;
    --dim: #93a1b3;
    --accent: #f2a33c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0a0d12; color:var(--txt);
    font:13px/1.5 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif; }
  canvas{ display:block; }

  #hud{ position:fixed; inset:0; pointer-events:none; }
  #hud > *{ pointer-events:auto; }

  .card{
    position:absolute; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; backdrop-filter: blur(14px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  #title{ top:18px; left:18px; padding:12px 16px; }
  #title h1{ margin:0; font-size:15px; font-weight:600; letter-spacing:.3px; }
  #title p{ margin:4px 0 0; font-size:11.5px; color:var(--dim); }
  #title .dot{ display:inline-block; width:6px;height:6px;border-radius:50%;background:var(--accent);
    margin-right:6px; vertical-align:middle; }

  #panel{ top:18px; right:18px; width:236px; padding:12px 14px; }
  #panel h2{ margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--dim); }
  .row{ display:flex; align-items:center; justify-content:space-between; margin:9px 0; }
  .row label{ color:#cbd6e3; font-size:12px; }
  .row output{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:11.5px; min-width:38px; text-align:right; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:3px; border-radius:2px;
    background:rgba(255,255,255,.16); outline:none; margin:2px 0 6px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px;height:12px;border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px rgba(242,163,60,.18); }
  .switch{ position:relative; width:34px;height:19px;border-radius:10px;background:rgba(255,255,255,.15);
    border:1px solid var(--line); cursor:pointer; transition:.18s; }
  .switch.on{ background:rgba(242,163,60,.85); }
  .switch i{ position:absolute; top:2px; left:2px; width:13px;height:13px;border-radius:50%;
    background:#fff; transition:.18s; }
  .switch.on i{ left:17px; }

  #views{ left:18px; bottom:18px; padding:8px; display:flex; gap:6px; }
  #views button{
    appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.04); color:#dbe4ee;
    padding:7px 12px; border-radius:8px; font-size:12px; cursor:pointer; transition:.15s;
  }
  #views button:hover{ background:rgba(255,255,255,.1); }
  #views button.active{ background:rgba(242,163,60,.9); color:#1a1206; border-color:transparent; font-weight:600; }

  #stats{ right:18px; bottom:18px; padding:9px 12px; font-size:11.5px; color:var(--dim);
    font-variant-numeric:tabular-nums; display:flex; gap:14px; }
  #stats b{ color:#e7edf5; font-weight:600; }

  #loader{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:radial-gradient(circle at 50% 45%, #16202b 0%, #070a0e 70%);
    z-index:10; transition:opacity .6s ease; }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader h3{ margin:0; font-size:14px; font-weight:500; letter-spacing:.4px; }
  #bar{ width:260px; height:3px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  #bar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#f2a33c,#ffd48a); transition:width .25s; }
  #pct{ font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #err{ max-width:520px; padding:0 24px; text-align:center; color:#ff9a9a; font-size:12.5px; line-height:1.7; display:none; }
</style>
</head>
<body>

<div id="hud">
  <div class="card" id="title">
    <h1><span class="dot"></span>储能变电站 · 3×4 ESS 机群</h1>
    <p>three.js WebGPURenderer · TSL 程序化天空 / 做旧金属</p>
  </div>

  <div class="card" id="panel">
    <h2>场景控制</h2>
    <div class="row"><label>曝光</label><output id="expoVal">1.00</output></div>
    <input id="expo" type="range" min="0.4" max="2.2" step="0.01" value="1">
    <div class="row"><label>太阳高度</label><output id="sunVal">46°</output></div>
    <input id="sun" type="range" min="8" max="82" step="1" value="46">
    <div class="row"><label>自动旋转</label><div class="switch" id="rotate"><i></i></div></div>
    <div class="row"><label>阴影</label><div class="switch on" id="shadow"><i></i></div></div>
    <div class="row"><label>雾</label><div class="switch on" id="fog"><i></i></div></div>
  </div>

  <div class="card" id="views">
    <button data-view="pano" class="active">全景</button>
    <button data-view="aerial">鸟瞰</button>
    <button data-view="close">近景</button>
    <button data-view="detail">风机特写</button>
  </div>

  <div class="card" id="stats">
    <span>后端 <b id="backend">…</b></span>
    <span>帧率 <b id="fps">–</b></span>
    <span>三角面 <b id="tris">–</b></span>
  </div>
</div>

<div id="loader" style="display:none">
  <h3>正在载入储能变电站模型（约 24 MB）</h3>
  <div id="bar"><i></i></div>
  <div id="pct">0%</div>
  <div id="err"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.webgpu.js",
    "three/webgpu": "./vendor/three/three.webgpu.js",
    "three/tsl": "./vendor/three/three.tsl.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./main.js?v=1"></script>
</body>
</html>
